<iframe id="caid-rc-frame" src="../report-cards.html" title="CAID Report Cards"
        style="width:100%;border:0;min-height:80vh;display:block" scrolling="no"></iframe>
<script>
window.addEventListener("message", function(e){
  if (e.data && typeof e.data.caidHeight === "number") {
    var f = document.getElementById("caid-rc-frame");
    if (f) f.style.height = (e.data.caidHeight + 24) + "px";
  }
});
</script>
