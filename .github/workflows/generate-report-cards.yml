name: Generate Report Cards Data

# Regenerates the report-cards chart and the per-model pages from their inputs,
# then commits the results. build.py / build_models.py exit non-zero if the
# numbers no longer reconcile, so this job also gates against shipping figures
# that drift from REPORT_v1.3. Same shape as the-autonomous-stack generate-catalog.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'data/v1_3_crosstab_v1_6_final.csv'
      - 'data/per_cell.json'
      - 'build.py'
      - 'build_models.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate report-cards chart (aborts if medians != REPORT_v1.3)
        run: python3 build.py
      - name: Regenerate per-model pages (aborts if per-cell != model rate)
        run: python3 build_models.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report-cards.html data.json docs/models
          git diff --cached --quiet || git commit -m "Auto-update report-cards + model pages [skip ci]"
          git push
